<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Oggetti in Scatola</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f4f8;
  color: #1a202c;
  min-height: 100vh;
}
header {
  background: #2b6cb0;
  color: white;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
header h1 { font-size: 1.3rem; font-weight: 700; }
#btn-nuova-scatola {
  background: #f6ad55;
  color: #1a202c;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
#btn-nuova-scatola:active { background: #ed8936; }
main { padding: 16px; max-width: 600px; margin: 0 auto; }

/* Scatola attiva */
#scatola-attiva {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  text-align: center;
}
#scatola-attiva .label {
  font-size: 0.85rem;
  color: #718096;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
#scatola-attiva .numero {
  font-size: 3.5rem;
  font-weight: 900;
  color: #2b6cb0;
  line-height: 1;
}
#scatola-attiva .numero.testo {
  font-size: 1.7rem;
}
#scatola-attiva .conteggio {
  font-size: 0.95rem;
  color: #718096;
  margin-top: 6px;
}
#scatola-attiva .meta-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
#scatola-attiva select, #scatola-attiva input.meta-input {
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 0.9rem;
  outline: none;
  background: white;
}
#scatola-attiva select:focus, #scatola-attiva input.meta-input:focus { border-color: #2b6cb0; }

/* Form aggiunta oggetto */
#form-section {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
#form-section h2 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 14px;
  color: #2d3748;
}
#oggetto-input, #categoria-input, #valore-input {
  width: 100%;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 1rem;
  outline: none;
  margin-bottom: 10px;
  -webkit-appearance: none;
  background: white;
}
#oggetto-input:focus, #categoria-input:focus, #valore-input:focus { border-color: #2b6cb0; }
#btn-aggiungi {
  width: 100%;
  background: #38a169;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
}
#btn-aggiungi:active { background: #276749; }
#feedback {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  display: none;
  text-align: center;
}
#feedback.ok { background: #c6f6d5; color: #22543d; display: block; }
#feedback.errore { background: #fed7d7; color: #742a2a; display: block; }

/* Lista scatole */
#lista-scatole h2 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 12px;
  color: #2d3748;
}
.scatola-card {
  background: white;
  border-radius: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  overflow: hidden;
}
.scatola-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.scatola-header:active { background: #f7fafc; }
.checkbox-scatola {
  width: 20px;
  height: 20px;
  margin-right: 12px;
  flex-shrink: 0;
  accent-color: #2b6cb0;
  cursor: pointer;
}
.scatola-titolo {
  font-weight: 700;
  font-size: 1rem;
  color: #2b6cb0;
}
.scatola-badges { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.badge {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 20px;
}
.badge-viaggio { background: #ebf8ff; color: #2b6cb0; }
.badge-stanza { background: #faf5ff; color: #6b46c1; }
.scatola-info {
  font-size: 0.85rem;
  color: #718096;
}
.scatola-toggle {
  font-size: 1.1rem;
  color: #a0aec0;
  transition: transform 0.2s;
}
.scatola-toggle.aperta { transform: rotate(180deg); }
.scatola-oggetti {
  display: none;
  padding: 0 18px 14px;
  border-top: 1px solid #f0f4f8;
}
.scatola-oggetti.visibile { display: block; }
.oggetto-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #f0f4f8;
  font-size: 0.9rem;
}
.oggetto-item:last-child { border-bottom: none; }
.oggetto-nome { color: #2d3748; font-weight: 600; font-size: 0.9rem; }
.oggetto-categoria { color: #718096; font-size: 0.82rem; }
.oggetto-valore { color: #2b6cb0; font-weight: 700; font-size: 0.82rem; margin-top: 1px; }
.scatola-totale {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0 4px;
  margin-top: 6px;
  border-top: 2px solid #e2e8f0;
  font-size: 0.9rem;
  font-weight: 700;
  color: #2d3748;
}
.scatola-totale .importo { color: #2b6cb0; font-size: 1rem; }
.btn-rimuovi {
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  color: #e53e3e;
  flex-shrink: 0;
}
.btn-rimuovi:active { background: #fff5f5; }
.btn-modifica {
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  color: #2b6cb0;
  flex-shrink: 0;
}
.btn-modifica:active { background: #ebf8ff; }
.scatola-card.bloccata .btn-modifica { opacity: 0.3; pointer-events: none; }
.select-sposta {
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  font-size: 0.7rem;
  padding: 3px 3px;
  background: white;
  color: #4a5568;
  max-width: 82px;
  margin-right: 4px;
}
.modal-cat-riga {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #f7fafc;
}
.modal-cat-riga input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: #9f7aea;
  flex-shrink: 0;
}
.modal-cat-riga .nome { font-weight: 600; color: #2d3748; font-size: 0.92rem; flex: 1; }
.modal-cat-riga .dettagli { color: #718096; font-size: 0.8rem; }
.btn-stampa, .btn-lucchetto {
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  color: #718096;
}
.btn-stampa:active, .btn-lucchetto:active { background: #f0f4f8; }
.scatola-card.bloccata .scatola-header { background: #f7fafc; }
.scatola-card.bloccata .scatola-titolo { color: #718096; }
.scatola-card.bloccata .btn-rimuovi { opacity: 0.3; pointer-events: none; }
.scatola-card.fuori-scatola { border-left: 4px solid #f6ad55; }
.scatola-card.diretti-auto { border-left: 4px solid #38a169; }
.scatola-card.bozza { border-left: 4px solid #9f7aea; }

.nessun-oggetto {
  color: #a0aec0;
  font-size: 0.85rem;
  padding: 8px 0;
  font-style: italic;
}

/* Ricerca */
#cerca-container { margin-bottom: 14px; position: relative; }
#cerca-input {
  width: 100%;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  padding: 12px 40px 12px 14px;
  font-size: 1rem;
  outline: none;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
#cerca-clear {
  display: none;
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 1.2rem;
  color: #a0aec0;
  cursor: pointer;
  padding: 4px;
}
#risultati-ricerca .res-item {
  background: white;
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#risultati-ricerca .res-nome { font-weight: 600; font-size: 0.9rem; color: #2d3748; }
#risultati-ricerca .res-categoria { font-size: 0.82rem; color: #718096; }
#risultati-ricerca .res-scatola {
  background: #2b6cb0;
  color: white;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.82rem;
  font-weight: 700;
  white-space: nowrap;
  margin-left: 10px;
}
#nessun-risultato {
  text-align: center;
  color: #a0aec0;
  padding: 20px;
  font-size: 0.95rem;
}

footer {
  text-align: center;
  padding: 24px 16px;
  color: #a0aec0;
  font-size: 0.8rem;
}

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #2d3748;
  color: white;
  padding: 12px 20px;
  border-radius: 24px;
  font-size: 0.95rem;
  font-weight: 600;
  z-index: 1000;
  transition: transform 0.3s ease;
  white-space: nowrap;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 12px;
}
#toast.visibile { transform: translateX(-50%) translateY(0); pointer-events: auto; }

#empty-state {
  text-align: center;
  padding: 32px 16px;
  color: #a0aec0;
}
#empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
#empty-state p { font-size: 0.95rem; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>🧳 Oggetti in Scatola</h1>
  <div style="display:flex; gap:6px; flex-wrap:wrap;">
    <button id="btn-bozza" style="background:white; color:#2b6cb0; border:none; border-radius:8px; padding:8px 12px; font-size:0.85rem; font-weight:700; cursor:pointer; white-space:nowrap;">📝 Bozza</button>
    <button id="btn-fuori-scatola" style="background:white; color:#2b6cb0; border:none; border-radius:8px; padding:8px 12px; font-size:0.85rem; font-weight:700; cursor:pointer; white-space:nowrap;">📤 Fuori scatola</button>
    <button id="btn-diretti-auto" style="background:white; color:#2b6cb0; border:none; border-radius:8px; padding:8px 12px; font-size:0.85rem; font-weight:700; cursor:pointer; white-space:nowrap;">🚗 Diretti in auto</button>
    <button id="btn-nuova-scatola">+ Nuova scatola</button>
  </div>
</header>

<main>

  <!-- Sincronizzazione tra dispositivi -->
  <div id="sync-bar" style="display:flex; gap:8px; margin-bottom:16px;">
    <button id="btn-esporta-dati" style="flex:1; background:white; color:#2b6cb0; border:2px solid #2b6cb0; border-radius:10px; padding:10px; font-size:0.85rem; font-weight:700; cursor:pointer;">⬇️ Esporta dati</button>
    <button id="btn-importa-dati" style="flex:1; background:white; color:#2b6cb0; border:2px solid #2b6cb0; border-radius:10px; padding:10px; font-size:0.85rem; font-weight:700; cursor:pointer;">⬆️ Unisci dati</button>
    <input type="file" id="file-importa" accept="application/json" style="display:none;" />
  </div>

  <!-- Scatola attiva -->
  <div id="scatola-attiva">
    <div class="label">Stai riempiendo</div>
    <div class="numero" id="numero-scatola">1</div>
    <div class="conteggio" id="conteggio-scatola">0 oggetti</div>
    <div class="meta-row">
      <select id="viaggio-select">
        <option value="">Viaggio…</option>
        <option value="1">Viaggio 1</option>
        <option value="2">Viaggio 2</option>
        <option value="3">Viaggio 3</option>
        <option value="4">Viaggio 4</option>
        <option value="dopo">Da spedire dopo</option>
      </select>
      <input type="text" id="stanza-input" class="meta-input" placeholder="Stanza destinazione…" />
    </div>
  </div>

  <!-- Form aggiunta -->
  <div id="form-section">
    <h2>Aggiungi oggetto</h2>
    <input id="oggetto-input" type="text" placeholder="Nome oggetto (es. Pentola grande)…" />
    <input id="categoria-input" type="text" placeholder="Categoria (opzionale, es. Cucina)…" list="categorie-suggerite" />
    <input id="valore-input" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Valore stimato in CHF (opzionale)…" />
    <datalist id="categorie-suggerite">
      <option value="Cucina">
      <option value="Vestiti">
      <option value="Elettronica">
      <option value="Bagno">
      <option value="Documenti">
      <option value="Decorazioni">
      <option value="Attrezzi">
      <option value="Giocattoli">
      <option value="Sport">
      <option value="Varie">
    </datalist>
    <button id="btn-aggiungi">Aggiungi alla scatola attiva</button>
    <div id="feedback"></div>
  </div>

  <!-- Lista scatole -->
  <div id="lista-scatole">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap;">
      <h2 style="margin-bottom:0;">Tutte le scatole</h2>
      <div style="display:flex; gap:6px;">
        <button id="btn-esporta-selezionate" style="display:none; background:#38a169; color:white; border:none; border-radius:8px; padding:8px 12px; font-size:0.82rem; font-weight:700; cursor:pointer; white-space:nowrap;">🖨️ Esporta selezionate (<span id="conteggio-selezionate">0</span>)</button>
        <button id="btn-esporta-categoria" style="background:#9f7aea; color:white; border:none; border-radius:8px; padding:8px 12px; font-size:0.82rem; font-weight:700; cursor:pointer; white-space:nowrap;">🖨️ Per categoria</button>
        <button id="btn-esporta-tutto" style="background:#2b6cb0; color:white; border:none; border-radius:8px; padding:8px 12px; font-size:0.82rem; font-weight:700; cursor:pointer; white-space:nowrap;">🖨️ Esporta tutto</button>
      </div>
    </div>

    <div id="cerca-container">
      <input id="cerca-input" type="text" placeholder="🔍 Cerca per nome o categoria…" />
      <button id="cerca-clear">✕</button>
    </div>
    <div id="risultati-ricerca" style="display:none; margin-bottom:12px;"></div>

    <div id="scatole-container">
      <div id="empty-state">
        <div class="emoji">🧳</div>
        <p>Nessun oggetto ancora.<br>Aggiungi il primo qui sopra!</p>
      </div>
    </div>
  </div>

</main>

<footer>Dati salvati su questo dispositivo — usa Esporta/Importa per sincronizzare con altri</footer>
<div id="toast"></div>

<!-- Modal selezione categorie -->
<div id="modal-categorie" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:2000; align-items:flex-end; justify-content:center;">
  <div style="background:white; border-radius:20px 20px 0 0; max-width:600px; width:100%; max-height:80vh; display:flex; flex-direction:column;">
    <div style="padding:18px 20px 10px; border-bottom:1px solid #f0f4f8; display:flex; justify-content:space-between; align-items:center;">
      <div style="font-weight:700; font-size:1.05rem; color:#2d3748;">Scegli le categorie</div>
      <button id="modal-cat-chiudi" style="background:none; border:none; font-size:1.3rem; color:#a0aec0; cursor:pointer; padding:4px;">✕</button>
    </div>
    <div id="modal-cat-lista" style="overflow-y:auto; padding:8px 20px; flex:1;"></div>
    <div style="padding:14px 20px; border-top:1px solid #f0f4f8; display:flex; gap:8px;">
      <button id="modal-cat-tutte" style="flex:1; background:white; color:#9f7aea; border:2px solid #9f7aea; border-radius:10px; padding:10px; font-size:0.85rem; font-weight:700; cursor:pointer;">Seleziona tutte</button>
      <button id="modal-cat-esporta" style="flex:1; background:#9f7aea; color:white; border:none; border-radius:10px; padding:10px; font-size:0.85rem; font-weight:700; cursor:pointer;">🖨️ Esporta</button>
    </div>
  </div>
</div>

<script>
// ── STATO ─────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'oggetti-in-scatola-v1';

function caricaDati() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { scatolaAttiva: 1, scatole: {}, bloccate: {}, meta: {} };
}

function salvaDati() { localStorage.setItem(STORAGE_KEY, JSON.stringify(stato)); }

let stato = caricaDati();
if (!stato.scatole[stato.scatolaAttiva]) stato.scatole[stato.scatolaAttiva] = [];
if (!stato.bloccate) stato.bloccate = {};
if (!stato.meta) stato.meta = {};
if (!stato.meta[stato.scatolaAttiva]) stato.meta[stato.scatolaAttiva] = { viaggio: '', stanza: '' };

const selezionate = new Set();

// ── ELEMENTI ──────────────────────────────────────────────────────────────────
const oggettoInput = document.getElementById('oggetto-input');
const categoriaInput = document.getElementById('categoria-input');
const valoreInput = document.getElementById('valore-input');
const btnAggiungi = document.getElementById('btn-aggiungi');
const feedback = document.getElementById('feedback');
const viaggioSelect = document.getElementById('viaggio-select');
const stanzaInput = document.getElementById('stanza-input');

function mostraFeedback(msg, tipo) {
  feedback.textContent = msg;
  feedback.className = tipo ? tipo : '';
  if (!tipo) feedback.style.display = 'none';
}

let toastTimeout = null;
function mostraToast(msg, azione) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${msg}</span>` + (azione ? `<button id="toast-azione" style="background:none; border:none; color:#63b3ed; font-weight:700; cursor:pointer; font-size:0.9rem; padding:0;">${azione.label}</button>` : '');
  t.classList.add('visibile');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('visibile'), azione ? 5000 : 2200);
  if (azione) {
    document.getElementById('toast-azione').addEventListener('click', () => {
      azione.onClick();
      t.classList.remove('visibile');
    });
  }
}

// ── META SCATOLA ATTIVA (viaggio/stanza) ───────────────────────────────────────
function caricaMetaAttiva() {
  const m = stato.meta[stato.scatolaAttiva] || { viaggio: '', stanza: '' };
  viaggioSelect.value = m.viaggio || '';
  stanzaInput.value = m.stanza || '';
}
viaggioSelect.addEventListener('change', () => {
  if (!stato.meta[stato.scatolaAttiva]) stato.meta[stato.scatolaAttiva] = {};
  stato.meta[stato.scatolaAttiva].viaggio = viaggioSelect.value;
  salvaDati();
  aggiornaUI();
});
stanzaInput.addEventListener('input', () => {
  if (!stato.meta[stato.scatolaAttiva]) stato.meta[stato.scatolaAttiva] = {};
  stato.meta[stato.scatolaAttiva].stanza = stanzaInput.value;
  salvaDati();
  aggiornaUI();
});

// ── AGGIUNTA OGGETTO ────────────────────────────────────────────────────────────
function aggiungiOggetto() {
  const nome = oggettoInput.value.trim();
  const categoria = categoriaInput.value.trim();
  const valoreRaw = valoreInput.value.trim();
  const valore = valoreRaw ? parseFloat(valoreRaw) : null;
  if (!nome) {
    mostraFeedback('Scrivi il nome dell\'oggetto.', 'errore');
    return;
  }
  if (stato.bloccate[stato.scatolaAttiva]) {
    mostraFeedback(`🔒 ${labelScatola(stato.scatolaAttiva)} è bloccata!`, 'errore');
    return;
  }
  stato.scatole[stato.scatolaAttiva].push({ nome, categoria, valore });
  stato.scatole[stato.scatolaAttiva].sort((a, b) =>
    a.nome.localeCompare(b.nome, 'it', { sensitivity: 'base' })
  );
  salvaDati();
  aggiornaUI();
  oggettoInput.value = '';
  categoriaInput.value = '';
  valoreInput.value = '';
  oggettoInput.focus();
  mostraToast(`📦 "${nome}" → ${labelScatola(stato.scatolaAttiva)}`);
  mostraFeedback('', '');
}
btnAggiungi.addEventListener('click', aggiungiOggetto);
oggettoInput.addEventListener('keydown', e => { if (e.key === 'Enter') categoriaInput.focus(); });
categoriaInput.addEventListener('keydown', e => { if (e.key === 'Enter') valoreInput.focus(); });
valoreInput.addEventListener('keydown', e => { if (e.key === 'Enter') aggiungiOggetto(); });

// ── EXPORT / IMPORT DATI (sincronizzazione manuale tra dispositivi) ────────────
document.getElementById('btn-esporta-dati').addEventListener('click', () => {
  const dataStr = JSON.stringify(stato, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const oggi = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `oggetti-in-scatola-${oggi}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  mostraToast('⬇️ Dati esportati');
});

const fileImporta = document.getElementById('file-importa');
document.getElementById('btn-importa-dati').addEventListener('click', () => {
  fileImporta.value = '';
  fileImporta.click();
});
fileImporta.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const importato = JSON.parse(ev.target.result);
      if (!importato.scatole) throw new Error('Formato non valido');

      let scatoleAggiunte = 0;
      let oggettiAggiunti = 0;

      for (const [numStr, oggettiImportati] of Object.entries(importato.scatole)) {
        const num = isChiaveSpeciale(numStr) ? numStr : Number(numStr);

        // Se la scatola non esiste ancora su questo dispositivo, la crea
        if (!stato.scatole[num]) {
          stato.scatole[num] = [];
          scatoleAggiunte++;
        }

        // Aggiunge solo gli oggetti non già presenti (stesso nome+categoria+valore = duplicato)
        for (const o of oggettiImportati) {
          const esisteGia = stato.scatole[num].some(x =>
            x.nome === o.nome &&
            (x.categoria || '') === (o.categoria || '') &&
            (x.valore ?? null) === (o.valore ?? null)
          );
          if (!esisteGia) {
            stato.scatole[num].push(o);
            oggettiAggiunti++;
          }
        }
        stato.scatole[num].sort((a, b) => a.nome.localeCompare(b.nome, 'it', { sensitivity: 'base' }));

        // Unisce i metadati (viaggio/stanza) solo se mancano su questo dispositivo
        if (importato.meta && importato.meta[num]) {
          if (!stato.meta[num]) stato.meta[num] = { viaggio: '', stanza: '' };
          if (!stato.meta[num].viaggio && importato.meta[num].viaggio) stato.meta[num].viaggio = importato.meta[num].viaggio;
          if (!stato.meta[num].stanza && importato.meta[num].stanza) stato.meta[num].stanza = importato.meta[num].stanza;
        }

        // Se la scatola era bloccata sull'altro dispositivo, mantiene il blocco anche qui
        if (importato.bloccate && importato.bloccate[num] && !stato.bloccate[num]) {
          stato.bloccate[num] = true;
        }
      }

      salvaDati();
      aggiornaUI();
      mostraToast(`⬆️ Unite ${scatoleAggiunte} nuove scatole, aggiunti ${oggettiAggiunti} oggetti`);
    } catch (err) {
      alert('Il file selezionato non è valido. Assicurati di aver scelto un file esportato da questa app.');
    }
  };
  reader.readAsText(file);
});

// ── HELPER ETICHETTA SCATOLA ────────────────────────────────────────────────────
function labelScatola(key) {
  if (key === 'fuori') return '📤 Fuori scatola';
  if (key === 'auto') return '🚗 Diretti in auto';
  if (key === 'bozza') return '📝 Bozza / Da valutare';
  return `🧳 Scatola ${key}`;
}
const CHIAVI_SPECIALI = ['bozza', 'fuori', 'auto'];
function isChiaveSpeciale(k) { return CHIAVI_SPECIALI.includes(k); }

// ── SPOSTAMENTO OGGETTI TRA CONTENITORI ─────────────────────────────────────────
function opzioniDestinazione(correnteKey) {
  const chiavi = Object.keys(stato.scatole);
  const chiaviNumeriche = chiavi.filter(k => !isChiaveSpeciale(k)).map(Number).sort((a, b) => a - b);
  const tutte = [...CHIAVI_SPECIALI, ...chiaviNumeriche];
  return tutte.map(k => `<option value="${k}" ${String(k) === String(correnteKey) ? 'selected' : ''}>${labelScatola(k)}</option>`).join('');
}

function spostaOggetto(daKey, idx, destKeyStr) {
  const destKey = isChiaveSpeciale(destKeyStr) ? destKeyStr : Number(destKeyStr);
  if (String(destKey) === String(daKey)) return;
  if (stato.bloccate[daKey]) { mostraToast(`🔒 ${labelScatola(daKey)} è bloccata`); aggiornaUI(); return; }
  if (stato.bloccate[destKey]) { mostraToast(`🔒 ${labelScatola(destKey)} è bloccata`); aggiornaUI(); return; }
  const oggetto = stato.scatole[daKey][idx];
  stato.scatole[daKey].splice(idx, 1);
  if (!stato.scatole[destKey]) stato.scatole[destKey] = [];
  stato.scatole[destKey].push(oggetto);
  stato.scatole[destKey].sort((a, b) => a.nome.localeCompare(b.nome, 'it', { sensitivity: 'base' }));
  if (!stato.meta[destKey]) stato.meta[destKey] = { viaggio: '', stanza: '' };
  salvaDati();
  aggiornaUI();
  mostraToast(`↔️ "${oggetto.nome}" spostato in ${labelScatola(destKey)}`);
}

// ── CAMBIO CATEGORIA OGGETTO ────────────────────────────────────────────────────
function elencoCategorieUsate() {
  const usate = new Set();
  Object.values(stato.scatole).forEach(oggetti => {
    oggetti.forEach(o => { if (o.categoria && o.categoria.trim()) usate.add(o.categoria.trim()); });
  });
  return [...new Set([...CATEGORIE_BASE, ...usate])].sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));
}

function opzioniCategoria(correnteCat) {
  const cat = (correnteCat || '').trim();
  const tutte = elencoCategorieUsate();
  const opzioni = [`<option value="" ${cat === '' ? 'selected' : ''}>— Nessuna categoria —</option>`];
  tutte.forEach(c => {
    opzioni.push(`<option value="${c}" ${c === cat ? 'selected' : ''}>${c}</option>`);
  });
  return opzioni.join('');
}

function cambiaCategoria(key, idx, nuovaCategoria) {
  if (stato.bloccate[key]) { mostraToast(`🔒 ${labelScatola(key)} è bloccata`); aggiornaUI(); return; }
  const oggetto = stato.scatole[key][idx];
  oggetto.categoria = nuovaCategoria.trim();
  salvaDati();
  aggiornaUI();
  mostraToast(`🏷️ Categoria di "${oggetto.nome}" aggiornata`);
}

// ── MODIFICA NOME/VALORE OGGETTO ────────────────────────────────────────────────
function modificaOggetto(key, idx) {
  if (stato.bloccate[key]) { mostraToast(`🔒 ${labelScatola(key)} è bloccata`); return; }
  const oggetto = stato.scatole[key][idx];

  const nuovoNome = prompt('Nome oggetto:', oggetto.nome);
  if (nuovoNome === null) return;
  const nomeTrim = nuovoNome.trim();
  if (!nomeTrim) { mostraToast('⚠️ Il nome non può essere vuoto'); return; }

  const valoreAttuale = (oggetto.valore !== null && oggetto.valore !== undefined && !isNaN(oggetto.valore)) ? String(oggetto.valore) : '';
  const nuovoValoreStr = prompt('Valore stimato in CHF (lascia vuoto per nessun valore):', valoreAttuale);

  oggetto.nome = nomeTrim;
  if (nuovoValoreStr !== null) {
    const valTrim = nuovoValoreStr.trim();
    oggetto.valore = valTrim ? parseFloat(valTrim) : null;
  }

  stato.scatole[key].sort((a, b) => a.nome.localeCompare(b.nome, 'it', { sensitivity: 'base' }));
  salvaDati();
  aggiornaUI();
  mostraToast(`✏️ "${oggetto.nome}" aggiornato`);
}

function toggleLucchetto(num) {
  if (stato.bloccate[num]) {
    delete stato.bloccate[num];
    mostraToast(`🔓 ${labelScatola(num)} sbloccata`);
  } else {
    stato.bloccate[num] = true;
    if (stato.scatolaAttiva == num) {
      const libera = Object.keys(stato.scatole).filter(k => !isChiaveSpeciale(k)).map(Number).find(n => !stato.bloccate[n] && n != num);
      if (libera) { stato.scatolaAttiva = libera; caricaMetaAttiva(); }
    }
    mostraToast(`🔒 ${labelScatola(num)} bloccata`);
  }
  salvaDati();
  aggiornaUI();
}

// ── RAGGRUPPAMENTO OGGETTI PER CATEGORIA ────────────────────────────────────────
function raggruppaPerCategoria() {
  const gruppi = {};
  let totOggetti = 0;
  for (const [num, oggetti] of Object.entries(stato.scatole)) {
    oggetti.forEach(o => {
      const cat = o.categoria && o.categoria.trim() ? o.categoria.trim() : 'Senza categoria';
      if (!gruppi[cat]) gruppi[cat] = [];
      gruppi[cat].push({ ...o, scatola: num });
      totOggetti++;
    });
  }
  const categorieOrdinate = Object.keys(gruppi).sort((a, b) => {
    if (a === 'Senza categoria') return 1;
    if (b === 'Senza categoria') return -1;
    return a.localeCompare(b, 'it', { sensitivity: 'base' });
  });
  return { gruppi, categorieOrdinate, totOggetti };
}

// ── STAMPA / EXPORT PER CATEGORIA (trasversale a tutte le scatole) ─────────────
function esportaPerCategoria(filtroCategorie) {
  const { gruppi, categorieOrdinate: tutteLeCategorie, totOggetti } = raggruppaPerCategoria();

  if (totOggetti === 0) {
    mostraToast('⚠️ Nessun oggetto da esportare');
    return;
  }

  const categorieOrdinate = filtroCategorie
    ? tutteLeCategorie.filter(c => filtroCategorie.includes(c))
    : tutteLeCategorie;

  if (categorieOrdinate.length === 0) {
    mostraToast('⚠️ Nessuna categoria selezionata');
    return;
  }

  let totaleGenerale = 0;

  const blocchi = categorieOrdinate.map(cat => {
    const oggetti = gruppi[cat].sort((a, b) => a.nome.localeCompare(b.nome, 'it', { sensitivity: 'base' }));
    const totale = sommaValori(oggetti);
    totaleGenerale += totale;
    const righe = oggetti.map((o, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${o.nome}</td>
        <td>${isChiaveSpeciale(o.scatola) ? labelScatola(o.scatola) : 'Scatola ' + o.scatola}</td>
        <td class="val">${(o.valore !== null && o.valore !== undefined && !isNaN(o.valore)) ? 'CHF ' + o.valore.toFixed(2) : '—'}</td>
      </tr>`).join('');
    return `
    <div class="blocco-scatola">
      <h2>${cat}</h2>
      <table>
        <thead><tr><th>#</th><th>Oggetto</th><th>Si trova in</th><th class="val">Valore stimato</th></tr></thead>
        <tbody>${righe}</tbody>
        <tfoot><tr><td colspan="3">Totale categoria</td><td class="val">CHF ${totale.toFixed(2)}</td></tr></tfoot>
      </table>
    </div>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<title>Elenco per categoria</title>
<style>

<body>

${blocchi}
<div class="totale-generale">
  <span>Totale valore complessivo</span>
  <span>CHF ${totaleGenerale.toFixed(2)}</span>
</div>

  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}
document.getElementById('btn-esporta-categoria').addEventListener('click', apriModalCategorie);

// ── MODAL SELEZIONE CATEGORIE ───────────────────────────────────────────────────
const modalCategorie = document.getElementById('modal-categorie');
const modalCatLista = document.getElementById('modal-cat-lista');

function apriModalCategorie() {
  const { gruppi, categorieOrdinate, totOggetti } = raggruppaPerCategoria();
  if (totOggetti === 0) {
    mostraToast('⚠️ Nessun oggetto da esportare');
    return;
  }
  modalCatLista.innerHTML = categorieOrdinate.map(cat => {
    const oggetti = gruppi[cat];
    const totale = sommaValori(oggetti);
    return `
    <label class="modal-cat-riga">
      <input type="checkbox" class="modal-cat-checkbox" value="${cat.replace(/"/g, '&quot;')}" checked />
      <span class="nome">${cat}</span>
      <span class="dettagli">${oggetti.length} ${oggetti.length === 1 ? 'oggetto' : 'oggetti'} · CHF ${totale.toFixed(2)}</span>
    </label>`;
  }).join('');
  modalCategorie.style.display = 'flex';
}

function chiudiModalCategorie() {
  modalCategorie.style.display = 'none';
}
document.getElementById('modal-cat-chiudi').addEventListener('click', chiudiModalCategorie);
modalCategorie.addEventListener('click', (e) => { if (e.target === modalCategorie) chiudiModalCategorie(); });

document.getElementById('modal-cat-tutte').addEventListener('click', () => {
  const checkboxes = modalCatLista.querySelectorAll('.modal-cat-checkbox');
  const tutteSelezionate = [...checkboxes].every(c => c.checked);
  checkboxes.forEach(c => { c.checked = !tutteSelezionate; });
});

document.getElementById('modal-cat-esporta').addEventListener('click', () => {
  const selezionate = [...modalCatLista.querySelectorAll('.modal-cat-checkbox:checked')].map(c => c.value);
  if (selezionate.length === 0) {
    mostraToast('⚠️ Seleziona almeno una categoria');
    return;
  }
  chiudiModalCategorie();
  esportaPerCategoria(selezionate);
});

// ── RICERCA ───────────────────────────────────────────────────────────────────
const cercaInput = document.getElementById('cerca-input');
const cercaClear = document.getElementById('cerca-clear');
const risultatiContainer = document.getElementById('risultati-ricerca');
const scatoleContainer = document.getElementById('scatole-container');

cercaInput.addEventListener('input', () => {
  const q = cercaInput.value.trim().toLowerCase();
  cercaClear.style.display = q ? 'block' : 'none';
  if (!q) {
    risultatiContainer.style.display = 'none';
    scatoleContainer.style.display = 'block';
    return;
  }
  scatoleContainer.style.display = 'none';
  risultatiContainer.style.display = 'block';

  const trovati = [];
  for (const [num, oggetti] of Object.entries(stato.scatole)) {
    oggetti.forEach(o => {
      if (o.nome.toLowerCase().includes(q) || (o.categoria || '').toLowerCase().includes(q)) {
        trovati.push({ ...o, scatola: num });
      }
    });
  }
  if (trovati.length === 0) {
    risultatiContainer.innerHTML = `<div id="nessun-risultato">Nessun oggetto trovato per "${cercaInput.value}"</div>`;
    return;
  }
  risultatiContainer.innerHTML = trovati.map(o => `
    <div class="res-item">
      <div>
        <div class="res-nome">${o.nome}</div>
        ${o.categoria ? `<div class="res-categoria">${o.categoria}</div>` : ''}
      </div>
      <div class="res-scatola">${isChiaveSpeciale(o.scatola) ? labelScatola(o.scatola) : 'Scatola ' + o.scatola}</div>
    </div>`).join('');
});
cercaClear.addEventListener('click', () => {
  cercaInput.value = '';
  cercaInput.dispatchEvent(new Event('input'));
});

// ── HELPER VALORE ─────────────────────────────────────────────────────────────
function sommaValori(oggetti) {
  return oggetti.reduce((s, o) => s + ((o.valore !== null && o.valore !== undefined && !isNaN(o.valore)) ? o.valore : 0), 0);
}

// ── CATEGORIE SUGGERITE DINAMICHE ───────────────────────────────────────────────
const CATEGORIE_BASE = ['Cucina', 'Vestiti', 'Elettronica', 'Bagno', 'Documenti', 'Decorazioni', 'Attrezzi', 'Giocattoli', 'Sport', 'Varie'];
function aggiornaCategorieSuggerite() {
  const tutte = elencoCategorieUsate();
  const datalist = document.getElementById('categorie-suggerite');
  datalist.innerHTML = tutte.map(c => `<option value="${c}">`).join('');
}

// ── UI ─────────────────────────────────────────────────────────────────────────
function aggiornaUI() {
  aggiornaCategorieSuggerite();
  const numeroEl = document.getElementById('numero-scatola');
  if (isChiaveSpeciale(stato.scatolaAttiva)) {
    numeroEl.textContent = labelScatola(stato.scatolaAttiva);
    numeroEl.classList.add('testo');
  } else {
    numeroEl.textContent = stato.scatolaAttiva;
    numeroEl.classList.remove('testo');
  }
  const n = (stato.scatole[stato.scatolaAttiva] || []).length;
  document.getElementById('conteggio-scatola').textContent = n === 1 ? '1 oggetto' : `${n} oggetti`;

  const chiavi = Object.keys(stato.scatole);
  const chiaviNumeriche = chiavi.filter(k => !isChiaveSpeciale(k)).map(Number).sort((a, b) => {
    const aBloccata = stato.bloccate[a] ? 1 : 0;
    const bBloccata = stato.bloccate[b] ? 1 : 0;
    if (aBloccata !== bBloccata) return aBloccata - bBloccata;
    return b - a;
  });
  const chiaviSpeciali = CHIAVI_SPECIALI.filter(k => chiavi.includes(k));
  const ordineChiavi = [...chiaviSpeciali, ...chiaviNumeriche];
  const totOggetti = Object.values(stato.scatole).reduce((s, a) => s + a.length, 0);

  if (totOggetti === 0) {
    scatoleContainer.innerHTML = `
      <div id="empty-state">
        <div class="emoji">🧳</div>
        <p>Nessun oggetto ancora.<br>Aggiungi il primo qui sopra!</p>
      </div>`;
    return;
  }

  scatoleContainer.innerHTML = ordineChiavi.map(num => {
    const oggetti = stato.scatole[num] || [];
    const meta = stato.meta[num] || {};
    const isAttiva = num === stato.scatolaAttiva;
    const viaggioLabel = meta.viaggio ? (meta.viaggio === 'dopo' ? 'Da spedire dopo' : `Viaggio ${meta.viaggio}`) : '';
    const chiaveJs = (typeof num === 'string') ? `'${num}'` : num;
    return `
    <div class="scatola-card${stato.bloccate[num] ? ' bloccata' : ''}${num === 'fuori' ? ' fuori-scatola' : ''}${num === 'auto' ? ' diretti-auto' : ''}${num === 'bozza' ? ' bozza' : ''}">
      <div class="scatola-header" onclick="toggleScatola(${chiaveJs})">
        <div style="display:flex; align-items:flex-start;">
          <input type="checkbox" class="checkbox-scatola" data-num="${num}" ${selezionate.has(num) ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelezione(${chiaveJs})" />
          <div>
            <div class="scatola-titolo">${labelScatola(num)}${isAttiva ? ' ✏️' : ''}</div>
            <div class="scatola-info">${oggetti.length === 1 ? '1 oggetto' : `${oggetti.length} oggetti`}</div>
            <div class="scatola-badges">
              ${viaggioLabel ? `<span class="badge badge-viaggio">${viaggioLabel}</span>` : ''}
              ${meta.stanza ? `<span class="badge badge-stanza">${meta.stanza}</span>` : ''}
            </div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="btn-lucchetto" onclick="event.stopPropagation(); toggleLucchetto(${chiaveJs})" title="${stato.bloccate[num] ? 'Sblocca' : 'Blocca'} scatola">${stato.bloccate[num] ? '🔒' : '🔓'}</button>
          <button class="btn-stampa" onclick="event.stopPropagation(); stampaScatola(${chiaveJs})" title="Esporta PDF completo">🖨️</button>
          <button class="btn-stampa" onclick="event.stopPropagation(); stampaScatola(${chiaveJs}, false)" title="Esporta PDF semplice (senza viaggio/stanza)">🧾</button>
          <div class="scatola-toggle" id="toggle-${num}">▼</div>
        </div>
      </div>
      <div class="scatola-oggetti" id="oggetti-${num}">
        ${oggetti.length === 0
          ? '<div class="nessun-oggetto">Nessun oggetto</div>'
          : oggetti.map((o, idx) => `
            <div class="oggetto-item">
              <div>
                <div class="oggetto-nome">${o.nome}</div>
                ${o.categoria ? `<div class="oggetto-categoria">${o.categoria}</div>` : ''}
                ${(o.valore !== null && o.valore !== undefined && !isNaN(o.valore)) ? `<div class="oggetto-valore">CHF ${o.valore.toFixed(2)}</div>` : ''}
              </div>
              <div style="display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:3px;">
                <select class="select-sposta" onclick="event.stopPropagation();" onchange="event.stopPropagation(); cambiaCategoria(${chiaveJs}, ${idx}, this.value)" ${stato.bloccate[num] ? 'disabled' : ''}>
                  ${opzioniCategoria(o.categoria)}
                </select>
                <select class="select-sposta" onclick="event.stopPropagation();" onchange="event.stopPropagation(); spostaOggetto(${chiaveJs}, ${idx}, this.value)" ${stato.bloccate[num] ? 'disabled' : ''}>
                  ${opzioniDestinazione(num)}
                </select>
                <button class="btn-modifica" onclick="event.stopPropagation(); modificaOggetto(${chiaveJs}, ${idx})" title="Modifica nome/valore">✏️</button>
                <button class="btn-rimuovi" onclick="rimuoviOggetto(${chiaveJs}, ${idx})" title="Rimuovi">✕</button>
              </div>
            </div>`).join('')
        }
        ${oggetti.length > 0 ? `
        <div class="scatola-totale">
          <span>Totale valore scatola</span>
          <span class="importo">CHF ${sommaValori(oggetti).toFixed(2)}</span>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');
  aggiornaBottoneSelezionate();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
caricaMetaAttiva();
aggiornaUI();
</script>

</body>
</html>
